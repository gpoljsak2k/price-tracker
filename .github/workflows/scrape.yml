name: scheduled-scrape

on:
  schedule:
    # 07:00 UTC = 08:00 Ljubljana (CET). Poleti je Ljubljana CEST (UTC+2), takrat bo to 09:00.
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run scheduled scrape
        run: |
          python app.py scrape-all --config tracked_items.json

      - name: Commit DB changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices.db
          git commit -m "Scheduled scrape" || echo "No changes to commit"
          git push
